<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Job Follow-up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #f9fafb;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #111827;
    }

    .status {
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
    }

    .status-label {
      color: #6b7280;
    }

    .status-value {
      font-weight: 500;
      color: #111827;
    }

    .connected {
      color: #10b981;
    }

    .not-connected {
      color: #ef4444;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: white;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background: #f9fafb;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .message-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .message-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .message-info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    .link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 13px;
      display: block;
      text-align: center;
      margin-top: 12px;
    }

    .link:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>LinkedIn Job Follow-up</h1>

  <div id="loading" class="loading">
    Loading...
  </div>

  <div id="content" style="display: none;">
    <div class="status">
      <div class="status-item">
        <span class="status-label">Status:</span>
        <span id="connectionStatus" class="status-value">Checking...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Last Sync:</span>
        <span id="lastSync" class="status-value">Never</span>
      </div>
    </div>

    <div id="message" style="display: none;"></div>

    <button id="syncButton" class="btn-primary">
      Sync LinkedIn Applications
    </button>

    <button id="openDashboard" class="btn-secondary">
      Open Dashboard
    </button>

    <div class="divider"></div>

    <a href="options.html" target="_blank" class="link">Extension Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
